<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Neil Oliver – Books, Application & Music</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/favicon.png" sizes="128x128">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <script src="https://www.paypal.com/sdk/js?client-id=AWMjw-JB6E8nFkjToPpNNJkpPk9lxnp1I8IF13-djVLcOQ2daRj2k8tCM4jEHkjm_C8mPpnyO1Wj_rF4&currency=USD&components=buttons,hosted-fields&disable-funding=venmo,credit"></script>

<style>
  :root {
    --primary: #8b4513;
    --secondary: #4a2c0d;
    --accent: #d4af37;
    --text: #f5f5f5;
    --overlay: rgba(0,0,0,0.58);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0f0a00;
    color: var(--text);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* HERO STYLES (unchanged) */
  .hero {
    position: relative;
    min-height: 100vh;
    background: var(--overlay) url('assets/NEW.png') center center / contain no-repeat;
    background-color: #0f0a00;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
  }

  .top-content { max-width: 920px; width: 100%; z-index: 10; }
  h1 { font-size: clamp(2.4rem, 7vw, 5.2rem); font-weight: 700; text-shadow: 0 6px 24px rgba(0,0,0,0.95); margin-bottom: 0.2em; }
  .subtitle { font-size: clamp(1.2rem, 4vw, 2.4rem); font-style: italic; margin-bottom: 20px; }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 100%;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 10;
  }

  .btn {
    padding: 16px 40px;
    min-width: 220px;
    font-size: 1.3rem;
    font-weight: bold;
    text-decoration: none;
    color: #111;
    background: var(--accent);
    border-radius: 60px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.7);
    transition: all 0.35s ease;
    cursor: pointer;
    border: none;
  }

  .btn-book { background: #e8c56a; }
  .btn-app { background: #380589; color: white; }
  .btn-Video { background: #b80b0e; color: white; }
  .btn-music { background: #b8860b; color: white; }

  @media (max-width: 600px) {
    .hero {
      display: block;
      height: auto;
      background-position: center 140px;
      background-size: 100%;
      padding-top: env(safe-area-inset-top);
    }
    .top-content { margin-bottom: 420px; padding-top: 40px; }
    .buttons { flex-direction: column; align-items: center; padding-bottom: 80px; }
    .btn { width: 90%; max-width: 320px; margin-bottom: 10px; }
  }

  /* ==================== PAYWALL MODAL FIX ==================== */
  #paywall-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px; /* extra breathing room on small screens */
    overflow-y: auto; /* important for iOS */
  }

  .modal-box {
    background: #140b00;
    padding: 30px 24px;
    border-radius: 20px;
    max-width: 400px;
    width: 100%;
    border: 1px solid var(--accent);
    max-height: 92vh;           /* ← prevents it from being taller than screen */
    overflow-y: auto;           /* ← enables scrolling inside modal */
    -webkit-overflow-scrolling: touch; /* smooth scrolling on iOS */
  }

  /* Make PayPal form fields look nice */
  #paypal-button-container {
    margin: 20px 0;
  }

  .close-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--text);
    border: 1px solid #666;
    border-radius: 50px;
    font-size: 1.1rem;
    margin-top: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="top-content">
      <img src="assets/monogram.png" alt="Monogram" style="width:70px; margin-bottom:15px;">
      <h1>Neil Oliver</h1>
      <div class="subtitle">Books, Application & Music</div>
    </div>

    <div class="buttons">
      <a href="books.html" class="btn btn-book">Books</a>
      <a href="App.html" class="btn btn-app">Neil's App Hub</a>
      <a href="video.html" class="btn btn-Video">Videos</a>
      <button type="button" id="music-btn" class="btn btn-music">Music</button>
    </div>
  </div>

  <!-- PAYWALL MODAL -->
  <div id="paywall-modal">
    <div class="modal-box">
      <h2 style="color:var(--accent); margin-bottom:15px; font-size: 2rem; text-align:center;">Unlock The Library</h2>
      <p style="margin-bottom:25px; font-size: 1.1rem; text-align:center;">
        One-time payment • $3.00<br>Full access forever
      </p>
      <div id="paypal-button-container"></div>
      <button class="close-btn" id="close-modal">Maybe Later</button>
    </div>
  </div>

  <script>
    const MUSIC_PAID_KEY = 'neilOliverMusicUnlocked';
    let deferredPrompt;

    const isIOS = () => {
      return ['iPad Simulator','iPhone Simulator','iPod Simulator','iPad','iPhone','iPod']
             .includes(navigator.platform) || 
             (navigator.userAgent.includes("Mac") && "ontouchend" in document);
    };

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function initPayPal() {
      const container = document.getElementById('paypal-button-container');
      if (window.paypal && container.innerHTML === '') {
        paypal.Buttons({
          createOrder: (data, actions) => {
            return actions.order.create({
              purchase_units: [{ amount: { value: '3.00' } }],
              application_context: { shipping_preference: "NO_SHIPPING" }
            });
          },
          onApprove: (data, actions) => {
            return actions.order.capture().then(details => {
              localStorage.setItem(MUSIC_PAID_KEY, 'true');
              document.getElementById('paywall-modal').style.display = 'none';
              if (isIOS()) {
                alert('Success! Tap "Share" → "Add to Home Screen"');
              }
              window.location.href = 'music.html';
            });
          }
        }).render('#paypal-button-container');
      }
    }

    document.getElementById('music-btn').addEventListener('click', () => {
      if (localStorage.getItem(MUSIC_PAID_KEY) === 'true') {
        window.location.href = 'music.html';
      } else {
        document.getElementById('paywall-modal').style.display = 'flex';
        initPayPal();
      }
    });

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('paywall-modal').style.display = 'none';
    });
  </script>
</body>
</html>
